# Mac CPE connection for XT-STCAR. Only this alias creates the web forward;
# Bluetooth keeps its own connection and port selection.
Host xt-stcar
    HostName 192.168.0.156
    User bianbu
    ControlMaster auto
    ControlPath /Users/yuhaojin/Documents/XT-STCAR/work/vehicle-test-ssh.sock
    ControlPersist yes
    ServerAliveInterval 15
    ServerAliveCountMax 3
    LocalForward 127.0.0.1:8081 127.0.0.1:8081

Host *
