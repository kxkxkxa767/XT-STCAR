# Mac CPE connection for XT-STCAR. Both the alias and direct-IP login create
# the same web forward and reuse the project connection.
Host xt-stcar 192.168.0.156
    HostName 192.168.0.156
    User bianbu
    ControlMaster auto
    ControlPath /Users/yuhaojin/Documents/XT-STCAR/work/vehicle-test-ssh.sock
    ControlPersist yes
    ServerAliveInterval 15
    ServerAliveCountMax 3
    LocalForward 127.0.0.1:8081 127.0.0.1:8081

Host *
