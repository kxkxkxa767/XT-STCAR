<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>打开车辆驾驶台</title><style>body{font:18px system-ui;max-width:560px;margin:60px auto;padding:24px;background:#10252d;color:#eef8f4}input,button{font:inherit;padding:12px;box-sizing:border-box;width:100%;margin:10px 0}button{background:#72e2bc;border:0;border-radius:8px}p{line-height:1.7}</style><h1>XT-STCAR 驾驶台</h1><p>安卓、Windows、Mac：连接车辆所在的同一局域网，用浏览器打开。手机长按方向按钮，电脑使用方向键或 WASD。</p><form id="entry"><label>车辆网址<input id="address" value="http://192.168.0.156:8081/" type="url" required></label><label>访问码（已有登录时可留空）<input id="token" type="password" autocomplete="off"></label><button>打开驾驶台</button></form><p id="message">此入口需要车端驾驶台服务正在运行。打开页面不会自动解锁。</p><script>document.getElementById('entry').onsubmit=e=>{e.preventDefault();try{const u=new URL(document.getElementById('address').value);if(u.protocol!=='http:'&&u.protocol!=='https:')throw Error('请输入 http 或 https 网址');const t=document.getElementById('token').value.trim();if(t&&!/^[A-Za-z0-9_-]{8,128}$/.test(t))throw Error('访问码需为8–128位字母、数字、短横线或下划线');u.hash=t?'token='+t:'';location.href=u.href;}catch(x){document.getElementById('message').textContent=x.message;}};</script></html>
